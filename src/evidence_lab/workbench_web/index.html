<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多模态检索工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><p class="eyebrow">本机离线原型 · 全量100PDF</p><h1>多模态检索工作台</h1><p id="boundary">正在加载真实模型与索引状态</p><p id="summary"></p></header>
<main><form id="search-form"><label>问题或关键词<input id="query" maxlength="500" value="Receiving Clerk" autocomplete="off"></label><label>文档<select id="documents"><option value="">全部文档</option></select></label><label>检索方式<select id="mode"><option value="hybrid">BGE + BM25</option><option value="bm25">BM25</option><option value="dense">BGE向量</option><option value="rerank">混合检索 + 重排</option><option value="agent">迭代检索 + 重排</option></select></label><button type="submit">查找证据</button></form>
<p id="search-status" role="status" aria-live="polite"></p><p class="notice" id="reader-status">Qwen阅读器未运行。当前只展示候选证据，尚未生成或核验答案。</p>
<div class="workspace"><section class="results"><h2>来源候选</h2><div id="hits"></div></section><section class="viewer"><h2 id="page-title">原始PDF页面</h2><p id="page-note"></p><p id="page-alert"></p><div class="page-image"><img id="page-image" alt="原始PDF页面" hidden><div id="region-box" hidden></div></div><pre id="evidence-text"></pre><button id="verify" type="button" hidden>核验来源绑定</button><p id="verification" role="status"></p></section></div>
<details><summary>迭代记录与预算</summary><pre id="trace">选择迭代检索后查看查询拆解、停止原因和来源页回溯。</pre></details></main><footer>真实BGE与重排推理。当前仅有检索与来源核验结果；答案准确率尚未评测。</footer><script src="/app.js"></script></body></html>
